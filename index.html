<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OSINT АНАЛИЗАТОР</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #00ff41; text-align: center; padding: 50px; }
        .terminal { background: #000; border: 2px solid #00ff41; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 20px #00ff41; }
        .btn { background: #00ff41; color: #000; border: none; padding: 15px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px; }
        #log { margin-top: 20px; text-align: left; font-family: monospace; display: none; border-top: 1px solid #00ff41; padding-top: 10px; }
        .map-link { display: block; background: #ff0000; color: white; padding: 10px; text-decoration: none; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="terminal">
    <h1>[ SYSTEM READY ]</h1>
    <p>User: Ruslan | Project: OSINT_Metadata</p>
    
    <input type="file" id="upload" accept="image/jpeg" style="display:none">
    
    <button class="btn" onclick="document.getElementById('upload').click()">ЗАГРУЗИТЬ ФОТО</button>
    <button class="btn" style="background:#444; color:#fff" onclick="finalBoss()">ТЕСТ СИСТЕМЫ</button>

    <div id="log"></div>
</div>

<script>
    // Самый надежный тест в мире
    function finalBoss() {
        alert("ОШИБКИ УСТРАНЕНЫ!\nТеперь JavaScript работает напрямую из index.html.");
        const log = document.getElementById('log');
        log.style.display = 'block';
        log.innerHTML = "> System: Online<br>> Sensors: Active<br>> Ready to scan JPEG...";
    }

    function toDD(coord) {
        if (!coord) return 0;
        return coord[0].numerator/coord[0].denominator + (coord[1].numerator/coord[1].denominator)/60 + (coord[2].numerator/coord[2].denominator)/3600;
    }

    document.getElementById('upload').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const log = document.getElementById('log');
        log.style.display = 'block';
        log.innerHTML = "> Scanning file: " + file.name + "...";

        EXIF.getData(file, function() {
            const tags = EXIF.getAllTags(this);
            if (Object.keys(tags).length > 0) {
                let res = "<h3>Analysis Result:</h3>";
                if (tags.Make) res += "Device: " + tags.Make + " " + (tags.Model || "") + "<br>";
                if (tags.DateTime) res += "Date: " + tags.DateTime + "<br>";
                if (tags.GPSLatitude) {
                    const lat = toDD(tags.GPSLatitude);
                    const lon = toDD(tags.GPSLongitude);
                    res += "<p style='color:red;'>[!] GEOLOCATION DETECTED</p>";
                    res += <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" class="map-link">OPEN COORDINATES</a>;
                } else { res += "GPS: No data."; }
                log.innerHTML = res;
            } else {
                log.innerHTML = "> No EXIF data found. File is clean.";
            }
        });
    };
</script>
</body>
</html>
