<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OSINT Проект</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .btn { background: #1a2a6c; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
        #output { margin-top: 20px; text-align: left; background: #eef2ff; padding: 15px; border-radius: 10px; display: none; }
        .map-btn { display: inline-block; background: #d93025; color: white; padding: 10px; border-radius: 5px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>OSINT Анализатор</h1>
    <p>Проект Руслана Джунейидова</p>
    
    <input type="file" id="photoInput" accept="image/jpeg" style="display:none">
    
    <button class="btn" onclick="document.getElementById('photoInput').click()">1. Выбрать фото</button>
    <button class="btn" style="background:#28a745" onclick="runTest()">2. Проверить работу</button>

    <div id="output"></div>
</div>

<script>
    // Самая простая проверка
    function runTest() {
        alert("JavaScript работает! Теперь попробуй загрузить фото.");
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.innerHTML = "<b>Статус:</b> Система готова к анализу оригинальных JPEG файлов.";
    }

    // Функция перевода координат
    function getDecimal(c) {
        if (!c) return 0;
        return c[0].numerator/c[0].denominator + (c[1].numerator/c[1].denominator)/60 + (c[2].numerator/c[2].denominator)/3600;
    }

    document.getElementById('photoInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const out = document.getElementById('output');
        out.style.display = 'block';
        out.innerHTML = "Анализирую метаданные...";

        EXIF.getData(file, function() {
            const tags = EXIF.getAllTags(this);
            console.log("Данные файла:", tags);

            if (Object.keys(tags).length > 0) {
                let info = "<h3>Результат:</h3>";
                if (tags.Make) info += "📱 Устройство: " + tags.Make + " " + (tags.Model || "") + "<br>";
                if (tags.DateTime) info += "📅 Дата: " + tags.DateTime + "<br>";

                if (tags.GPSLatitude && tags.GPSLongitude) {
                    const lat = getDecimal(tags.GPSLatitude);
                    const lon = getDecimal(tags.GPSLongitude);
                    info += "<p style='color:red;'>📍 КООРДИНАТЫ НАЙДЕНЫ!</p>";
                    info += <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" class="map-btn">Показать на карте</a>;
                } else {
                    info += "<p style='color:orange;'>Геоданные не найдены (возможно, фото из соцсетей или GPS был выключен).</p>";
                }
                out.innerHTML = info;
            } else {
                out.innerHTML = "<b>Файл чист.</b> В нем нет скрытых метаданных.";
            }
        });
    };
</script>

</body>
</html>
