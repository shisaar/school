<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OSINT TEST</title>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .label { font-weight: bold; }
        .value { color: red; }
    </style>
</head>
<body>

<div class="card">
    <h2>Проверка анализатора</h2>
    <input type="file" id="fileInput" accept="image/jpeg">
    <button onclick="testApp()" style="margin-top:10px;">Тест интерфейса (без фото)</button>
    
    <div id="out" style="margin-top:20px;"></div>
</div>

<script>
    // Функция для имитации работы, если фото "пустое"
    function testApp() {
        const out = document.getElementById('out');
        out.innerHTML = '<h3>Тестовый вывод:</h3>' +
            '<div class="result-item"><span class="label">Статус:</span><span class="value">Скрипт работает!</span></div>' +
            '<div class="result-item"><span class="label">Совет:</span><span>Попробуй фото-оригинал с телефона.</span></div>';
    }

    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        const out = document.getElementById('out');
        out.innerHTML = "Чтение файла...";

        EXIF.getData(file, function() {
            const data = EXIF.getAllTags(this);
            console.log(data); // Это для отладки в консоли F12
            
            if (Object.keys(data).length === 0) {
                out.innerHTML = "<b style='color:orange;'>Файл прочитан, но метаданных EXIF в нем нет.</b>";
                return;
            }

            out.innerHTML = "<h3>Данные найдены:</h3>";
            for (let a in data) {
                if (typeof data[a] !== 'object') { // Выводим только простые значения
                    out.innerHTML += <div class="result-item"><span class="label">${a}:</span><span class="value">${data[a]}</span></div>;
                }
            }
        });
    };
</script>
</body>
</html>
