<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Физика: Маятник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card">
        <h1>Лаборатория: Колебания</h1>

        <div class="canvas-container">
            <canvas id="pendulumCanvas"></canvas>
            <canvas id="graphCanvas"></canvas>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <label>Амплитуда (A)</label>
                <input type="range" id="amplitude" min="0" max="140" value="100">
            </div>
            <div class="control-row">
                <label>Частота (ω)</label>
                <input type="range" id="frequency" min="0.5" max="8" step="0.1" value="3">
            </div>
            <button id="resetBtn">Толкнуть маятник</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
