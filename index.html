<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OSINT Проект</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .btn { background: #1a2a6c; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        #res { margin-top: 20px; padding: 15px; background: #eef2ff; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Продукт готов</h1>
    <p>Нажми кнопку ниже, чтобы проверить работу скрипта</p>
    
    <input type="file" id="fileInp" accept="image/jpeg" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInp').click()">1. Выбрать фото</button>
    <br>
    <button class="btn" style="background: #28a745;" onclick="checkSystem()">2. Проверить систему</button>

    <div id="res"></div>
</div>

<script>
    // Новая функция с новым именем, чтобы обойти кэш
    function checkSystem() {
        console.log("Функция вызвана");
        alert("Система работает! JavaScript активен.");
        const res = document.getElementById('res');
        res.style.display = 'block';
        res.innerHTML = "<b>Статус:</b> Готов к анализу файлов.<br><b>Автор:</b> Руслан Джунейидов";
    }

    document.getElementById('fileInp').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const res = document.getElementById('res');
        res.style.display = 'block';
        res.innerHTML = "Анализирую...";

        EXIF.getData(file, function() {
            const tags = EXIF.getAllTags(this);
            console.log(tags);
            
            if (Object.keys(tags).length > 0) {
                res.innerHTML = "<h3>Данные найдены:</h3>";
                if (tags.Make) res.innerHTML += "Устройство: " + tags.Make + "<br>";
                if (tags.Model) res.innerHTML += "Модель: " + tags.Model + "<br>";
                if (tags.DateTime) res.innerHTML += "Дата: " + tags.DateTime + "<br>";
                if (tags.GPSLatitude) res.innerHTML += "<b>Геолокация обнаружена!</b>";
            } else {
                res.innerHTML = "Скрытых данных не обнаружено (фото очищено).";
            }
        });
    };
    function checkSystem() {
        alert("Система активна. Готов к поиску координат!");
        const res = document.getElementById('res');
        res.style.display = 'block';
        res.innerHTML = "<b>Статус:</b> Ожидание файла...<br><b>Автор:</b> Руслан Джунейидов";
    }

    // Функция для перевода координат EXIF в десятичные для карт
    function toDecimal(number) {
        if (!number) return 0;
        return number[0].numerator + number[1].numerator / (60 * number[1].denominator) + number[2].numerator / (3600 * number[2].denominator);
    }

    document.getElementById('fileInp').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const res = document.getElementById('res');
        res.style.display = 'block';
        res.innerHTML = "<b>Анализ структуры файла...</b>";

        EXIF.getData(file, function() {
            const tags = EXIF.getAllTags(this);
            console.log(tags);
            
            if (Object.keys(tags).length > 0) {
                let html = "<h3>Результаты OSINT-анализа:</h3>";
                if (tags.Make) html += "📱 <b>Устройство:</b> " + tags.Make + " " + (tags.Model || "") + "<br>";
                if (tags.DateTime) html += "📅 <b>Время снимка:</b> " + tags.DateTime + "<br>";
                
                if (tags.GPSLatitude && tags.GPSLongitude) {
                    // Конвертируем в формат для Google Maps
                    const lat = toDecimal(tags.GPSLatitude);
                    const lon = toDecimal(tags.GPSLongitude);
                    
                    html += "<p style='color:red; font-weight:bold;'>📍 ГЕОЛОКАЦИЯ НАЙДЕНА!</p>";
                    html += <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="display:inline-block; background:#db4437; color:white; padding:10px; border-radius:5px; text-decoration:none; margin-top:10px;">Открыть точку на картах</a>;
                } else {
                    html += "<p style='color:orange;'>Координаты не найдены (возможно, выключен GPS в камере).</p>";
                }
                res.innerHTML = html;
            } else {
                res.innerHTML = "<b style='color:red;'>Внимание:</b> В этом файле нет метаданных. Фото безопасно для публикации.";
            }
            
        });
    };
</script>

</body>
</html>
